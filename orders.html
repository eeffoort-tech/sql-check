<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="warehouse.css">
    <style>
        .orders-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .orders-header h1 {
            margin: 0;
            color: #e0e0ff;
        }

        .orders-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .orders-actions .btn-action {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid;
            transition: all 0.2s;
        }

        .btn-all-docs {
            background: rgba(100, 100, 255, 0.2);
            color: #c0c0ff;
            border-color: rgba(100, 100, 255, 0.4);
        }

        .btn-all-docs:hover {
            background: rgba(100, 100, 255, 0.3);
        }

        .orders-stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(100, 100, 255, 0.1);
            border: 1px solid rgba(100, 100, 255, 0.2);
            border-radius: 8px;
            padding: 12px 20px;
            flex: 1;
            min-width: 120px;
            text-align: center;
            cursor: default;
            transition: all 0.2s;
        }

        .stat-card.stat-filterable {
            cursor: pointer;
        }

        .stat-card.stat-filterable:hover {
            background: rgba(100, 100, 255, 0.2);
            border-color: rgba(100, 100, 255, 0.4);
        }

        .stat-card.stat-active {
            background: rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.5);
        }

        .stat-card .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #8b5cf6;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: #a0a0c0;
            margin-top: 4px;
        }

        .orders-table-wrapper {
            background: rgba(30, 30, 60, 0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(100, 100, 255, 0.15);
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }

        .orders-table thead th {
            background: rgba(100, 100, 255, 0.15);
            color: #c0c0ff;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(100, 100, 255, 0.2);
        }

        .orders-table tbody tr {
            cursor: pointer;
            transition: background 0.2s;
        }

        .orders-table tbody tr:hover {
            background: rgba(139, 92, 246, 0.15);
        }

        .orders-table tbody tr td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(100, 100, 255, 0.08);
            color: #d0d0ff;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-plan {
            background: rgba(52, 152, 219, 0.2);
            color: #5dade2;
            border: 1px solid rgba(52, 152, 219, 0.4);
        }

        .status-draft {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            border: 1px solid rgba(243, 156, 18, 0.4);
        }

        .status-order {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.4);
        }

        .status-done {
            background: rgba(149, 165, 166, 0.2);
            color: #95a5a6;
            border: 1px solid rgba(149, 165, 166, 0.4);
        }

        /* Модальное окно деталей */
        .order-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
        }

        .order-detail-modal .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }

        .order-detail-modal .modal-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            background: linear-gradient(135deg, #1e1e3f 0%, #2d2d6b 100%);
            border-radius: 16px;
            border: 1px solid rgba(100, 100, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(100, 100, 255, 0.2);
        }

        .modal-header h3 {
            margin: 0;
            color: #e0e0ff;
            font-size: 18px;
        }

        .btn-modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: #a0a0c0;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .btn-modal-close:hover {
            color: #fff;
            background: rgba(231, 76, 60, 0.3);
        }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(100, 100, 255, 0.2);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .detail-info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .detail-info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-info-item .label {
            font-size: 11px;
            color: #a0a0c0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-info-item .value {
            font-size: 14px;
            color: #d0d0ff;
            font-weight: 600;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
        }

        .detail-table thead th {
            background: rgba(100, 100, 255, 0.1);
            color: #c0c0ff;
            padding: 10px 12px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(100, 100, 255, 0.2);
        }

        .detail-table tbody td {
            padding: 10px 12px;
            color: #d0d0ff;
            font-size: 14px;
            border-bottom: 1px solid rgba(100, 100, 255, 0.08);
        }

        .detail-empty {
            text-align: center;
            padding: 40px;
            color: #a0a0c0;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(100, 100, 255, 0.2);
            background: rgba(100, 100, 255, 0.1);
            color: #c0c0ff;
            transition: all 0.2s;
        }

        .btn-small:hover {
            background: rgba(100, 100, 255, 0.2);
        }

        .btn-mark-done {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(149, 165, 166, 0.4);
            background: rgba(149, 165, 166, 0.2);
            color: #95a5a6;
            transition: all 0.2s;
        }

        .btn-mark-done:hover {
            background: rgba(149, 165, 166, 0.3);
        }

        .no-orders {
            text-align: center;
            padding: 60px 20px;
            color: #a0a0c0;
        }

        .no-orders-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .create-plan-section {
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(52, 152, 219, 0.1);
            border: 1px solid rgba(52, 152, 219, 0.3);
            border-radius: 8px;
        }

        .create-plan-section h4 {
            margin: 0 0 12px 0;
            color: #5dade2;
        }

        .create-plan-section p {
            margin: 0;
            color: #a0a0c0;
            font-size: 14px;
        }

        .loading-message {
            text-align: center;
            padding: 40px;
            color: #a0a0c0;
        }
    </style>
</head>
<body>
    <div class="orders-container">
        <div class="orders-header">
            <h1>📋 Заказы</h1>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <button id="backToWarehouseBtn" class="btn btn-ghost btn-small" style="padding:10px 20px; font-size:14px; font-weight:600;">← Назад</button>
                <label style="display:flex; align-items:center; gap:6px; font-size:14px; color:#c0c0ff; cursor:pointer; user-select:none;">
                    <input type="checkbox" id="showMyOnly">
                    Показать только мои
                </label>
                <div class="orders-actions">
                    <button class="btn-action btn-all-docs" id="btnAllDocs">📋 Все заказы</button>
                </div>
            </div>
        </div>

        <div class="orders-stats">
            <div class="stat-card stat-filterable" data-filter="plan">
                <div class="stat-value" id="statPlan">0</div>
                <div class="stat-label">План</div>
            </div>
            <div class="stat-card stat-filterable" data-filter="draft">
                <div class="stat-value" id="statDraft">0</div>
                <div class="stat-label">Черновик</div>
            </div>
            <div class="stat-card stat-filterable" data-filter="order">
                <div class="stat-value" id="statOrder">0</div>
                <div class="stat-label">Заказ</div>
            </div>
            <div class="stat-card stat-filterable" data-filter="done">
                <div class="stat-value" id="statDone">0</div>
                <div class="stat-label">Выполнен</div>
            </div>
        </div>

        <div class="orders-table-wrapper">
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>№ документа</th>
                        <th>Пользователь</th>
                        <th>Количество</th>
                        <th>Дата / Время</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr>
                        <td colspan="5" class="loading-message">Загрузка...</td>
                    </td>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно деталей заказа -->
    <div id="orderDetailModal" class="order-detail-modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="detailTitle">Детали заказа</h3>
                <button class="btn-modal-close">×</button>
            </div>
            <div class="modal-body">
                <div id="detailInfo" class="detail-info"></div>
                <table class="detail-table">
                    <thead>
                        <tr>
                            <th>Код</th>
                            <th>Артикул</th>
                            <th>Количество</th>
                        </tr>
                    </thead>
                    <tbody id="detailItemsBody"></tbody>
                </table>
                <div id="detailEmptyMsg" class="detail-empty" style="display:none;">Нет товаров</div>
            </div>
            <div class="modal-footer">
                <button id="btnCreateOrderFromModal" style="background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.4); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; display: none;" onmouseenter="this.style.background='rgba(46, 204, 113, 0.3)'; this.style.borderColor='rgba(46, 204, 113, 0.6)';" onmouseleave="this.style.background='rgba(46, 204, 113, 0.2)'; this.style.borderColor='rgba(46, 204, 113, 0.4)';">📦 Создать заказ</button>
                <button id="btnSaveDraftFromModal" style="background: rgba(243, 156, 18, 0.2); color: #f39c12; border: 1px solid rgba(243, 156, 18, 0.4); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; display: none;" onmouseenter="this.style.background='rgba(243, 156, 18, 0.3)'; this.style.borderColor='rgba(243, 156, 18, 0.6)';" onmouseleave="this.style.background='rgba(243, 156, 18, 0.2)'; this.style.borderColor='rgba(243, 156, 18, 0.4)';">💾 Сохранить как черновик</button>
                <button id="btnDeleteFromModal" style="background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.4); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; display: none;" onmouseenter="this.style.background='rgba(231, 76, 60, 0.3)'; this.style.borderColor='rgba(231, 76, 60, 0.6)';" onmouseleave="this.style.background='rgba(231, 76, 60, 0.2)'; this.style.borderColor='rgba(231, 76, 60, 0.4)';">🗑️ Удалить</button>
                <button class="btn-small" id="btnCloseDetail">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="warehouse.js"></script>
    <script src="orders.js"></script>
</body>
</html>
